name: Signal API contracts

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pwm_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: pwm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pwm_test -d pwm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://pwm_test:ci-test-only@127.0.0.1:5432/pwm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
